name: Release
on:
  push:
    tags: ['v*']
jobs:
  release:
    # Required so the default GITHUB_TOKEN can create/publish the Release.
    permissions:
      contents: write
    strategy:
      # One OS failing must not cancel the others' builds/publishes.
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --publish always
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
