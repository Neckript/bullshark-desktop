name: Release
on:
  push:
    tags: ['v*']
jobs:
  release:
    # Required so the default GITHUB_TOKEN can create/publish the Release.
    permissions:
      contents: write
    strategy:
      # One OS failing must not cancel the others' builds/publishes.
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --publish always
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload artifacts to Codeberg
        continue-on-error: true
        shell: bash
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          # NOTE: GitHub runs this with `bash -e -o pipefail`; every curl below
          # is shielded with `|| true` + explicit HTTP-status logging so a
          # Codeberg failure is diagnosable instead of killing the script.
          TAG=${GITHUB_REF_NAME}
          API="https://codeberg.org/api/v1/repos/The_Neckript/bullshark-desktop"
          # Create release (idempotent — fall back to fetching it if it already exists)
          CREATE_STATUS=$(curl -s -o create.json -w '%{http_code}' \
            -H "Authorization: token $CODEBERG_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\"}" \
            "$API/releases" || true)
          echo "Codeberg create-release: HTTP $CREATE_STATUS"
          RELEASE_ID=$(jq -r '.id // empty' create.json 2>/dev/null || true)
          if [ -z "$RELEASE_ID" ]; then
            FETCH_STATUS=$(curl -s -o fetch.json -w '%{http_code}' \
              -H "Authorization: token $CODEBERG_TOKEN" \
              "$API/releases/tags/$TAG" || true)
            echo "Codeberg fetch-release: HTTP $FETCH_STATUS"
            RELEASE_ID=$(jq -r '.id // empty' fetch.json 2>/dev/null || true)
          fi
          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
            echo "::warning::Could not obtain Codeberg RELEASE_ID (create HTTP $CREATE_STATUS; check CODEBERG_TOKEN scope) — skipping Codeberg upload"
            exit 0
          fi
          echo "Codeberg release id: $RELEASE_ID"
          # Upload per-OS artifacts.
          # The asset name MUST match what latest.yml points at, or the updater
          # 404s on download after correctly detecting the new version — and it
          # does so silently. electron-builder normalises spaces to dashes when
          # it writes latest.yml for the GitHub publisher ("Bullshark Setup
          # 0.1.7.exe" becomes "Bullshark-Setup-0.1.7.exe"), so the same
          # normalisation has to be applied here; curl otherwise names the asset
          # after the raw basename, spaces included.
          # .blockmap files are included so electron-updater can do differential
          # downloads instead of pulling the whole installer every time.
          for f in dist/*.exe dist/*.AppImage dist/*.dmg dist/*.zip dist/*.blockmap dist/latest*.yml; do
            [ -f "$f" ] || continue
            ASSET_NAME=$(basename "$f" | tr ' ' '-')
            UP_STATUS=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: token $CODEBERG_TOKEN" \
              -F "attachment=@${f};filename=${ASSET_NAME}" \
              "$API/releases/$RELEASE_ID/assets" || true)
            echo "upload ${ASSET_NAME}: HTTP $UP_STATUS"
          done
