appId: fr.bullshark.desktop
productName: Bullshark
directories:
  output: dist
  buildResources: build
files:
  - out/**
extraResources:
  - from: build/tray
    to: tray
publish:
  provider: github
  owner: Neckript
  repo: bullshark-desktop
  # Publish the GitHub Release immediately (not as a draft) so the auto-updater
  # sees it. electron-builder defaults to 'draft', which would require a manual
  # "Publish" click and keep the update invisible to installed clients.
  releaseType: release
win:
  # L'.ico est fabrique a la main par build/make-icons.sh : chaque taille y est
  # reduite en Lanczos depuis l'art nettoye. Sans cette ligne, electron-builder
  # reduit build/icon.png tout seul et les tailles 16-24 px, celles de la barre
  # des taches et des notifications, deviennent illisibles.
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
mac:
  target:
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]
  category: public.app-category.social-networking
linux:
  # AppImage only: it is the universal Linux format and needs no maintainer
  # email. The deb target requires an author 'email' (absent here) and was the
  # sole cause of the Linux release failure.
  target:
    - target: AppImage
      arch: [x64]
  category: Network
